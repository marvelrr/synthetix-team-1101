<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Free trial</title>
<h1>Start free trial</h1>
<p>Test fixture: nothing is sent anywhere.</p>
<form id="signup">
<label>Full name <input name="name" required autocomplete="off"></label>
<label>Email <input name="email" type="email" required autocomplete="off"></label>
<label>Phone <input name="phone" type="tel" required autocomplete="off"></label>
<button type="submit">Proceed</button>
</form>
<script>
document.querySelector('#signup').addEventListener('submit',event=>{
 event.preventDefault();
 if(event.currentTarget.reportValidity()) location.href='welcome.html';
});
</script></html>
