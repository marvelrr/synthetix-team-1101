[theme]
base = "light"
primaryColor = "#147D68"
backgroundColor = "#F7F8F3"
secondaryBackgroundColor = "#E9F0EA"
textColor = "#173B33"
font = "sans serif"

[client]
showErrorDetails = "none"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
